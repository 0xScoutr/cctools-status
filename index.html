<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCTools Status</title>
  <meta name="description" content="Live status of the CCTools public API and the surfaces around it." />

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://status.cctools.network" />
  <meta property="og:title" content="CCTools Status" />
  <meta property="og:description" content="Live status of the CCTools public API." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CCTools Status" />
  <meta name="twitter:description" content="Live status of the CCTools public API." />
  <meta name="theme-color" content="#fcfcf9" />
  <meta name="color-scheme" content="light" />

  <link rel="canonical" href="https://status.cctools.network" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />

  <!-- Fonts: Fraunces (display, variable serif), DM Sans (body), JetBrains Mono (data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Cache-bust query string. Bump v=N whenever assets change since
       we don't hash filenames. Without this the previous _headers
       `immutable` directive trapped users on stale CSS. -->
  <link rel="stylesheet" href="/assets/styles.css?v=4" />
</head>
<body>
  <main class="page">
    <header class="masthead">
      <a class="brand" href="https://cctools.network" rel="noopener">
        <span class="brand-dot" aria-hidden="true"></span>
        CCTools
      </a>
      <span class="masthead-sep" aria-hidden="true">/</span>
      <span class="masthead-section">Status</span>
      <span class="masthead-date" id="masthead-date"></span>
    </header>

    <!-- Hero status statement — the page's defining surface -->
    <section class="hero" id="hero">
      <div class="hero-eyebrow" id="hero-eyebrow">
        <span class="dot" id="hero-dot" aria-hidden="true"></span>
        <span id="hero-eyebrow-text">Checking</span>
      </div>
      <h1 class="hero-title" id="hero-title">Loading status.</h1>
      <p class="hero-meta" id="hero-meta">Connecting to api.cctools.network…</p>
    </section>

    <!-- Single unified list — every monitored thing in one place -->
    <section class="services" aria-labelledby="services-h2">
      <div class="section-head">
        <h2 id="services-h2">Services</h2>
        <span class="section-sub" id="services-sub">—</span>
      </div>

      <ul class="service-list" id="service-list">
        <li class="service-row svc-row-loading">
          <div class="svc-name">Loading checks…</div>
        </li>
      </ul>
    </section>

    <!-- Incidents (active + recent, conditional) -->
    <section class="incidents" id="incidents-section" hidden aria-labelledby="incidents-h2">
      <div class="section-head">
        <h2 id="incidents-h2">Recent updates</h2>
        <span class="section-sub">Last 30 days</span>
      </div>
      <ul class="incidents-list" id="incidents-list"></ul>
    </section>

    <footer class="footer">
      <div class="footer-links">
        <a href="https://api.cctools.network/api/v1/openapi.json" target="_blank" rel="noopener">OpenAPI spec</a>
        <a href="https://docs.cctools.network/api" target="_blank" rel="noopener">API documentation</a>
        <a href="https://cctools.network/profile/api" target="_blank" rel="noopener">Get an API key</a>
        <a href="https://cctools.network/contact" target="_blank" rel="noopener">Report an issue</a>
      </div>
      <div class="footer-note">
        <span>Built by</span> <a href="https://cctools.network" rel="noopener">CCTools</a> <span>·</span>
        <span>Source on</span> <a href="https://github.com/0xScoutr/cctools-status" target="_blank" rel="noopener">GitHub</a>
      </div>
    </footer>
  </main>

  <script src="/assets/script.js?v=4" defer></script>
</body>
</html>
